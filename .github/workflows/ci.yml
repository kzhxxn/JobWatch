name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select latest Xcode (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build
        run: swift build -c release
