name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write        # 빌드 provenance 어테스테이션(OIDC)
  attestations: write

jobs:
  build:
    runs-on: macos-15
    env:
      # secret 존재 여부를 if 조건에서 쓰기 위해 job-level env로 노출
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select latest Xcode (Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        env:
          JOBWATCH_VERSION: ${{ github.ref_name }}   # 태그(v0.1.3)에서 v 제거해 주입
        run: |
          export JOBWATCH_VERSION="${JOBWATCH_VERSION#v}"
          chmod +x build-app.sh
          ./build-app.sh

      # ── Developer ID 서명 + 공증 (아래 secrets가 설정된 경우에만 동작) ──
      # 필요한 repo secrets:
      #   MACOS_CERT_P12_BASE64  : Developer ID Application .p12 (base64)
      #   MACOS_CERT_PASSWORD    : 위 .p12 비밀번호
      #   MACOS_SIGN_IDENTITY    : "Developer ID Application: Name (TEAMID)"
      #   AC_API_KEY_P8_BASE64   : App Store Connect API 키 .p8 (base64)
      #   AC_API_KEY_ID          : API 키 ID
      #   AC_API_ISSUER_ID       : Issuer ID
      - name: Sign & notarize (if secrets present)
        if: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          # 임시 키체인에 인증서 로드
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Developer ID 서명 (하드런타임)
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" JobWatch.app
          # 공증 (App Store Connect API 키)
          echo "$AC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/ac.p8"

      - name: Package DMG
        run: |
          mkdir -p dist/dmg
          cp -R JobWatch.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "JobWatch" -srcfolder dist/dmg \
            -ov -format UDZO "JobWatch-${GITHUB_REF_NAME}.dmg"

      - name: Notarize & staple DMG (if secrets present)
        if: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "JobWatch-${GITHUB_REF_NAME}.dmg" \
            --key "$RUNNER_TEMP/ac.p8" --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" --wait
          xcrun stapler staple "JobWatch-${GITHUB_REF_NAME}.dmg"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "JobWatch-*.dmg"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: JobWatch-*.dmg
          body: |
            JobWatch ${{ github.ref_name }}

            If notarized, this opens with a double-click. Otherwise (ad-hoc build):
            right-click → Open once, or `xattr -dr com.apple.quarantine JobWatch.app`.
